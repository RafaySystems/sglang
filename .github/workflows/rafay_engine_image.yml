# Rafay: build the SGLang engine image, verify it is actually our fork, and
# optionally overlay the Mooncake and LMCache wheels into a bundle.
#
# On GitHub rather than Jenkins for the same reason as the wheels: the Jenkins
# builder has ~3.7 GB and died compiling a far lighter project. A GitHub runner
# gives 16 GB and ~88 GB free disk.
#
# ## The build arg that decides whether this is our engine
#
# docker/Dockerfile defaults to BRANCH_TYPE=remote, which git-clones
# sgl-project/sglang from GitHub. Building our fork's Dockerfile does NOT, by
# itself, build our fork. Without BRANCH_TYPE=local the build either stops on
# the SGL_VERSION guard or -- worse, if someone supplies SGL_VERSION to get past
# it -- succeeds and ships upstream source carrying our tag and labels.
#
# So it is set here, and then verified by running the image: a label proves what
# we asked for, not what arrived.

name: Rafay engine image

on:
    push:
        tags:
            - 'v*-rafay.*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Rafay tag to build, e.g. v0.5.16-rafay.2'
                required: true
            ubuntu_mirror:
                description: 'Apt mirror. Default https://archive.ubuntu.com/ubuntu — HTTPS, because the build host throttles port 80 to ~13 KB/s while HTTPS is unaffected. An internal mirror is better still.'
                required: false
            skip_bundle:
                description: 'Build the base image only, without the wheel overlay.'
                type: boolean
                default: false

env:
    REGISTRY: registry.dev.rafay-edge.net
    REPOSITORY: rafay
    IMAGE_NAME: gmaas-sglang

permissions:
    contents: read

jobs:
    # The isolation tests gate the image. This build takes hours; the tests take
    # minutes, and an image that ships without them is an image carrying the
    # tenant-scoping patches with nothing having checked them.
    test:
        name: Test
        uses: ./.github/workflows/rafay_test.yml

    build:
        name: Build engine image
        needs: test
        # Standard runner: 4 cores / 16 GB. Larger runners are not available
        # here, so the build has to fit rather than be given more room -- see
        # max-parallelism below, which is what makes it fit.
        runs-on: ${{ vars.RAFAY_BUILD_RUNNER || 'ubuntu-latest' }}
        # SGLang compiles sgl-kernel, DeepEP, MSCCL++ and the FlashInfer JIT
        # cache. Hours, not minutes — but bounded, so a hang does not sit at the
        # 6-hour default.
        timeout-minutes: 350
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            upstream: ${{ steps.tag.outputs.upstream }}
            image: ${{ steps.tag.outputs.image }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.inputs.tag || github.ref }}
                fetch-depth: 0

            - name: Resolve tag
              id: tag
              run: |
                TAG="${{ github.event.inputs.tag || github.ref_name }}"
                case "$TAG" in
                  v*-rafay.*) ;;
                  *) echo "::error::'$TAG' does not match v<upstream>-rafay.<n>"; exit 1 ;;
                esac
                UPSTREAM="${TAG%-rafay.*}"
                echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
                echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
                echo "image=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$TAG" >> "$GITHUB_OUTPUT"

                # The delta is the fork's liability, so surface it every build.
                if git rev-parse -q --verify "${UPSTREAM}^{commit}" >/dev/null; then
                  echo "Rafay commits on ${UPSTREAM}: $(git rev-list --count ${UPSTREAM}..HEAD)"
                else
                  echo "::warning::upstream tag ${UPSTREAM} not present; delta unmeasurable"
                fi

            - name: Free disk space
              # Unlike the wheel builds, this one genuinely needs the room: a
              # CUDA devel base plus kernel compilation runs to tens of GB.
              # Only the large, certainly-unused trees — no `docker image prune`,
              # which hung for minutes on the LMCache run.
              run: |
                echo "before:"; df -h / | tail -1
                sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
                echo "after:";  df -h / | tail -1

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3
              with:
                # BuildKit runs independent stages concurrently by default. This
                # Dockerfile has several heavy ones -- DeepEP, MSCCL++, sgl-kernel,
                # and a `cargo build --release` of sgl-model-gateway -- and a
                # release rustc build alone can want several GB per codegen unit.
                # On a 16 GB runner, two or three of those at once is an OOM, and
                # the OOM killer produces no error: the log simply stops
                # mid-stage, which is exactly what the first run did.
                # **One stage at a time.**
                #
                # BuildKit runs independent stages concurrently by default, and
                # this Dockerfile has several that are individually large:
                # DeepEP, MSCCL++, sgl-kernel, and a `cargo build --release` of
                # sgl-model-gateway. A release rustc build alone can want several
                # GB per codegen unit; two heavy stages at once on 16 GB is an
                # OOM, and the OOM killer leaves no error -- the log simply stops
                # mid-stage, which is what the first run did.
                #
                # Serial is slow and finishes. The registry cache below means a
                # re-run resumes rather than recompiling everything, so the cost
                # is paid mostly once.
                buildkitd-config-inline: |
                  [worker.oci]
                    max-parallelism = 1

            - name: Report builder capacity
              # The first run died with no diagnostic. Print the numbers so the
              # next failure is readable from the log rather than inferred from
              # its absence.
              run: |
                echo "memory:"; free -h | sed -n '1,2p'
                echo "cpus:   $(nproc)"
                echo "disk:";   df -h / | tail -1

            - name: Sample memory during the build
              # The previous failure left no evidence at all -- no compiler
              # error, no exit code, just silence and a cancelled job. Peak
              # memory is the one number that distinguishes "the host ran out"
              # from "the runner was reclaimed", and it cannot be recovered
              # after the fact. Sample it now so the next failure is diagnosed
              # rather than inferred.
              run: |
                nohup bash -c '
                  peak=0
                  while true; do
                    used=$(free -m | awk "/^Mem:/ {print \$3}")
                    [ "$used" -gt "$peak" ] && peak=$used && echo "$(date -u +%H:%M:%S) peak_used_mb=$peak"
                    sleep 5
                  done' > /tmp/mem-sample.log 2>&1 &
                echo "sampler started"

            - name: Check registry credentials
              env:
                USER_SET: ${{ secrets.RAFAY_REGISTRY_USER != '' }}
                PASS_SET: ${{ secrets.RAFAY_REGISTRY_PASSWORD != '' }}
              run: |
                if [ "$USER_SET" != "true" ] || [ "$PASS_SET" != "true" ]; then
                  echo "::error::Registry credentials are not set for this repository."
                  echo "Add RAFAY_REGISTRY_USER and RAFAY_REGISTRY_PASSWORD at:"
                  echo "  ${{ github.server_url }}/${{ github.repository }}/settings/secrets/actions"
                  exit 1
                fi

            - name: Log in to the Rafay registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ secrets.RAFAY_REGISTRY_USER }}
                password: ${{ secrets.RAFAY_REGISTRY_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./docker/Dockerfile
                platforms: linux/amd64
                push: true
                provenance: false
                tags: ${{ steps.tag.outputs.image }}
                # Registry cache rather than GHA cache: this image's layers
                # exceed the 10 GB GHA cache limit, and a cache that silently
                # evicts is worse than none.
                cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:buildcache
                cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true
                build-args: |
                    BRANCH_TYPE=local
                    UBUNTU_MIRROR=${{ github.event.inputs.ubuntu_mirror || vars.RAFAY_UBUNTU_MIRROR || 'https://archive.ubuntu.com/ubuntu' }}
                    # 1, not 2. Run 30929746689 died 41 minutes in, mid-nvcc,
                    # with no compiler error: the log stopped and the job ended
                    # "The operation was canceled" -- the self-hosted runner
                    # stopped answering, which is what a host OOM looks like
                    # from GitHub's side. The same workload killed the Jenkins
                    # agent outright ("Cannot contact node-1").
                    #
                    # nvcc on SM90 CUTLASS/CUTE attention templates is the
                    # heaviest thing in this tree and forks cicc and ptxas per
                    # translation unit, so "2 jobs" is not 2 processes. Serial
                    # is slower and finishes; the registry cache means a re-run
                    # resumes rather than starting over.
                    MAX_JOBS=1
                    CARGO_BUILD_JOBS=1
                    BUILD_AND_DOWNLOAD_PARALLEL=1
                    # A prebuilt wheel install, not a compile -- it costs disk
                    # and download time, not memory, so disabling it does not
                    # help an OOM. Kept on because it removes first-request JIT
                    # compilation, which matters directly for scale-to-zero
                    # cold starts.
                    INSTALL_FLASHINFER_JIT_CACHE=1
                    # Empty keeps upstream's per-CUDA-version arch list; on
                    # CUDA 13 that is '9.0;10.0;10.3', three architectures and
                    # therefore three times the nvcc memory. Set to '9.0' to
                    # build H100 only if the build is still memory-bound after
                    # MAX_JOBS=1 -- the largest single lever available, and one
                    # that narrows what the image can run on, so it is a
                    # deliberate choice rather than a default.
                    RAFAY_CUDA_ARCH_LIST=${{ vars.RAFAY_CUDA_ARCH_LIST }}
                    SGLANG_BUILD_COMMIT=${{ github.sha }}
                    SGLANG_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                    SGLANG_IMAGE_TAG=${{ steps.tag.outputs.image }}
                labels: |
                    io.rafay.upstream.version=${{ steps.tag.outputs.upstream }}
                    io.rafay.upstream.commit=${{ github.sha }}
                    io.rafay.tag=${{ steps.tag.outputs.tag }}

            - name: Why did it die
              if: failure()
              # Runs only on failure, and only reads. If the OOM killer took a
              # compiler -- or the runner agent -- it is recorded here and
              # nowhere else GitHub can see.
              run: |
                echo "=== peak memory during build ==="
                tail -5 /tmp/mem-sample.log 2>/dev/null || echo "(no samples)"
                echo "=== kernel OOM kills ==="
                sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process|oom-kill" | tail -20 \
                  || journalctl -k --since "-1h" --no-pager 2>/dev/null | grep -iE "out of memory|killed process|oom-kill" | tail -20 \
                  || echo "(kernel log unreadable from this job -- check the runner host directly)"
                echo "=== disk ==="
                df -h / | tail -1

    bundle:
        name: Overlay the wheels
        needs: build
        if: ${{ github.event.inputs.skip_bundle != 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        outputs:
            image: ${{ needs.build.outputs.image }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Read the bundle manifest
              id: bundle
              # The manifest is the single source for what ships together. Read
              # it here rather than accepting parameters, so the tag alone
              # determines the bundle and a rebuild months later composes the
              # same three artefacts.
              run: |
                python3 - <<'PY' >> "$GITHUB_OUTPUT"
                import yaml
                m = yaml.safe_load(open(".rafay/bundle.yaml"))
                c = m["components"]
                print(f"version={m['bundle']}")
                for name in ("mooncake", "lmcache"):
                    print(f"{name}_image={c[name]['image']}:{c[name]['tag']}")
                    print(f"{name}_tag={c[name]['tag']}")
                PY
                cat "$GITHUB_OUTPUT"

            - name: Log in to the Rafay registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ secrets.RAFAY_REGISTRY_USER }}
                password: ${{ secrets.RAFAY_REGISTRY_PASSWORD }}

            - name: Confirm the wheel images exist
              # A missing wheel image otherwise surfaces as a confusing pull
              # failure inside a multi-stage build, naming a stage rather than
              # the component or the pipeline that was supposed to publish it.
              run: |
                for ref in "${{ steps.bundle.outputs.mooncake_image }}" "${{ steps.bundle.outputs.lmcache_image }}"; do
                  if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
                    echo "::error::$ref not found. Its wheel pipeline must publish before the bundle can be assembled."
                    exit 1
                  fi
                  echo "found $ref"
                done

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push the bundle
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./docker/Dockerfile.rafay
                platforms: linux/amd64
                push: true
                provenance: false
                # Overwrites the base tag deliberately: the artefact that ships
                # is the bundle, and leaving a same-named image lacking the
                # forked components is how the wrong one gets deployed.
                tags: ${{ needs.build.outputs.image }}
                build-args: |
                    BASE_IMAGE=${{ needs.build.outputs.image }}
                    MOONCAKE_WHEEL_IMAGE=${{ steps.bundle.outputs.mooncake_image }}
                    LMCACHE_WHEEL_IMAGE=${{ steps.bundle.outputs.lmcache_image }}
                    MOONCAKE_VERSION=${{ steps.bundle.outputs.mooncake_tag }}
                    LMCACHE_VERSION=${{ steps.bundle.outputs.lmcache_tag }}
                    BUNDLE_VERSION=${{ steps.bundle.outputs.version }}

    verify:
        name: Verify the image is the fork
        # After the bundle, not beside it: verifying the base and then
        # overwriting that tag would certify an artefact nobody deploys.
        needs: [build, bundle]
        if: ${{ always() && needs.build.result == 'success' && needs.bundle.result != 'failure' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Log in to the Rafay registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ secrets.RAFAY_REGISTRY_USER }}
                password: ${{ secrets.RAFAY_REGISTRY_PASSWORD }}

            - name: Assert the scoping patch is present and working
              # Setting BRANCH_TYPE=local proves only that we asked. This proves
              # the source arrived: the module exists, it functions, and the
              # commit baked into ENV is the one we built. An image failing here
              # is upstream wearing our label — the most misleading artefact this
              # pipeline could produce.
              run: |
                docker run --rm --entrypoint python3 ${{ needs.build.outputs.image }} -c "
                import os
                from sglang.srt.mem_cache.tenant_scope import tenant_scope_seed
                assert tenant_scope_seed('acme') != tenant_scope_seed('globex'), 'scoping present but not functioning'
                assert tenant_scope_seed(None) is None, 'unset scope must not seed'
                got = os.environ.get('SGLANG_BUILD_COMMIT', '')
                assert got == '${{ github.sha }}', f'image built from {got}, expected ${{ github.sha }}'
                import importlib.metadata as md
                import torch
                # Only an import proves the wheels link against this image's
                # torch. Version metadata proves only that pip ran.
                for mod in ('mooncake', 'lmcache'):
                    __import__(mod)
                print('verified: fork source, commit', got)
                print('  torch   ', torch.__version__, 'cuda', torch.version.cuda)
                print('  mooncake', md.version('mooncake-transfer-engine'))
                print('  lmcache ', md.version('lmcache'))
                "

            - name: Summary
              run: |
                {
                  echo "### SGLang engine image"
                  echo ""
                  echo "| | |"
                  echo "|---|---|"
                  echo "| Image | \`${{ needs.build.outputs.image }}\` |"
                  echo "| Upstream | ${{ needs.build.outputs.upstream }} |"
                  echo "| Verified | fork source, scoping patch functional |"
                  echo ""
                  echo "**Not yet a tenant-isolating build**: R2 is incomplete"
                  echo "(\`_storage_hit_query\` still hashes raw tokens) and Tier 3a"
                  echo "conformance has not been run. No provider is certified."
                } >> "$GITHUB_STEP_SUMMARY"
